# One manual Windows x64 acceptance of the tooling package on official Hermes 0.23.0.
# Owner rule: GitHub runners only for Windows x64 and only when really needed; never ARM.
# Windows knowledge base = backend "file": bge-m3 in-process through ONNX Runtime and one
# SQLite file. No PostgreSQL, no Ollama, no service: run 42908480218 showed that a server
# started in one step is gone in the next one, and a student's Codex shell kills children
# the same way. Every step below is self-contained; only files carry over between steps.
name: Windows tooling x64
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tooling:
    name: windows-2025-hermes-0.23.0-tooling
    runs-on: windows-2025
    timeout-minutes: 80
    env:
      HERMES_SHA: 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19
      HERMES_INSTALLER_SHA256: ed5769c269e001eace6a67ad07fb3a02d62e0402345bc5d963d58524b14b5115
      BWS_VERSION: 2.1.0
      BWS_ZIP_SHA256: 8d6f2b51beb6f992b5b1de8b85a98bdf18de74096b724d17fa06219fc23f2bd5
      AGENTS_TOOLING_QA_MAX_FILES: '3'
      # No PYTHONUTF8: the package must read and write its files as UTF-8 by itself,
      # the way it runs on a student's Windows. Only the console output is UTF-8 here.
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - name: Official Hermes 0.23.0 with the reviewed installer (newline-normalized pin)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path=Join-Path $env:RUNNER_TEMP 'official-hermes-install.ps1'
          $url="https://raw.githubusercontent.com/NousResearch/hermes-agent/$env:HERMES_SHA/scripts/install.ps1"
          for($i=1;$i -le 4;$i++){try{Invoke-WebRequest -UseBasicParsing $url -OutFile $path -TimeoutSec 60;break}catch{if($i -eq 4){throw};Start-Sleep -Seconds (10*$i)}}
          # GitHub raw serves LF; the reviewed pin is the CRLF form of the same file.
          $text=[Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($path)).Replace("`r`n","`n").Replace("`n","`r`n")
          $bytes=[Text.Encoding]::UTF8.GetBytes($text)
          $hasher=[Security.Cryptography.SHA256]::Create();$actual=([BitConverter]::ToString($hasher.ComputeHash($bytes))).Replace('-','').ToLowerInvariant();$hasher.Dispose()
          if($actual -ne $env:HERMES_INSTALLER_SHA256){throw "Official installer SHA256 mismatch: $actual"}
          Remove-Item -LiteralPath $path -Force
          & ([scriptblock]::Create($text)) -Commit $env:HERMES_SHA -NonInteractive -SkipBrowser -SkipComputerUse
          if($LASTEXITCODE){exit $LASTEXITCODE}
          $hermes=Join-Path $env:LOCALAPPDATA 'hermes\bin\hermes.exe'
          if(-not (Test-Path -LiteralPath $hermes)){$hermes=(Get-Command hermes -ErrorAction Stop).Source}
          $version=(& $hermes --version 2>&1|Out-String);$version
          if($version -notmatch 'v0\.23\.0'){throw 'Hermes is not 0.23.0'}
      # Cyrillic text: PowerShell 7 reads the step as UTF-8; Windows PowerShell 5.1 would
      # read the BOM-less script in cp1252 and break its strings.
      - name: Course-like profiles (synthetic; Windows v3 itself is not installed here)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          [Console]::OutputEncoding=[Text.Encoding]::UTF8;$OutputEncoding=[Text.Encoding]::UTF8
          $root=Join-Path $env:LOCALAPPDATA 'hermes\profiles'
          foreach($p in 'tech','copywriter'){
            $dir=Join-Path $root $p
            New-Item -ItemType Directory -Force -Path (Join-Path $dir 'skills\lighthouse\references') | Out-Null
            Set-Content -LiteralPath (Join-Path $dir 'skills\lighthouse\SKILL.md') -Encoding UTF8 -Value "# Маяк`nНавык про маяк и проверку локального поиска для профиля $p."
            Set-Content -LiteralPath (Join-Path $dir 'skills\lighthouse\references\note.md') -Encoding UTF8 -Value 'Справка: маяк светит кораблям ночью.'
            Set-Content -LiteralPath (Join-Path $dir 'AGENTS.md') -Encoding UTF8 -Value "# $p`nЛичное правило ученика."
            Set-Content -LiteralPath (Join-Path $dir 'SOUL.md') -Encoding UTF8 -Value "# Душа $p"
            Set-Content -LiteralPath (Join-Path $dir 'config.yaml') -Encoding UTF8 -Value "model:`n  provider: fixture`ndisplay:`n  name: Технарь $p"
            Set-Content -LiteralPath (Join-Path $dir 'auth.json') -Encoding UTF8 -Value 'CANARY-WINDOWS-SECRET'
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tooling venv from the hashed locks; inventory finds official Hermes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m venv "$env:RUNNER_TEMP\tv"
          $py="$env:RUNNER_TEMP\tv\Scripts\python.exe"
          # Windows needs both locks in this one venv: requirements.lock (MCP, documents) and
          # requirements-whisper.lock (onnxruntime, tokenizers, numpy for bge-m3; faster-whisper).
          & $py -m pip install -q --disable-pip-version-check --require-hashes -r requirements.lock; if($LASTEXITCODE){exit 1}
          & $py -m pip install -q --disable-pip-version-check --require-hashes -r requirements-whisper.lock; if($LASTEXITCODE){exit 1}
          & $py -m pip check; if($LASTEXITCODE){exit 1}
          if(-not (Test-Path -LiteralPath "$env:RUNNER_TEMP\tv\Scripts\pythonw.exe")){throw 'pythonw.exe missing in the venv'}
          $inv=& $py -B inventory.py | Out-String; $inv | Set-Content "$env:RUNNER_TEMP\inventory.json"
          $d=$inv|ConvertFrom-Json
          "INVENTORY hermes=$($d.hermesVersion) browser=$($d.browserMode) profiles=$(($d.profiles|%{$_.id}) -join ',')"
          if($d.hermesVersion -ne '0.23.0'){throw 'inventory did not find official Hermes 0.23.0'}
          if(@($d.profiles).Count -ne 2){throw 'inventory did not find the profiles'}
          if($inv -match 'CANARY-WINDOWS-SECRET'){throw 'inventory leaked a secret'}
      - name: Pinned bge-m3 ONNX model - fetch, repeat without changes, full SHA-256 check
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          [Console]::OutputEncoding=[Text.Encoding]::UTF8;$OutputEncoding=[Text.Encoding]::UTF8
          $py="$env:RUNNER_TEMP\tv\Scripts\python.exe";$m="$env:RUNNER_TEMP\models\bge-m3-onnx";$t="$env:RUNNER_TEMP\tooling"
          New-Item -ItemType Directory -Force $t|Out-Null
          $c=Get-Content settings.windows.example.json -Raw|ConvertFrom-Json
          $c.kbFile="$t\kb\agents-student-kb.sqlite";$c.embeddingModelDir=$m
          [IO.File]::WriteAllText("$t\settings.json",($c|ConvertTo-Json -Depth 8))
          $first=& $py -B student_tools.py fetch-embedding-model --model-dir $m | Out-String;"FETCH1 $first"
          if($LASTEXITCODE){throw 'model fetch failed'}
          if(($first|ConvertFrom-Json).changed -ne $true){throw 'first fetch did not install the model'}
          $again=& $py -B student_tools.py fetch-embedding-model --model-dir $m | Out-String;"FETCH2 $again"
          if($LASTEXITCODE -or ($again|ConvertFrom-Json).changed -ne $false){throw 'model fetch is not idempotent'}
          $mc=& $py -B student_tools.py --config "$t\settings.json" model-check | Out-String;"MODEL_CHECK $mc"
          if($LASTEXITCODE -or -not ($mc|ConvertFrom-Json).verified){throw 'model-check failed'}
          "MODEL_DISK_BYTES $((Get-ChildItem -LiteralPath $m -File | Measure-Object Length -Sum).Sum)"
      # Cyrillic text: PowerShell 7 reads the step as UTF-8.
      - name: Doctor, bootstrap with index, Russian search, no-op repeat, one index at a time
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          [Console]::OutputEncoding=[Text.Encoding]::UTF8;$OutputEncoding=[Text.Encoding]::UTF8
          $py="$env:RUNNER_TEMP\tv\Scripts\python.exe";$t="$env:RUNNER_TEMP\tooling";$s="$t\settings.json";$h=Join-Path $env:LOCALAPPDATA 'hermes'
          $dr=& $py -B student_tools.py --config $s doctor | Out-String;"DOCTOR $dr"
          if($LASTEXITCODE){throw 'doctor failed'}
          $d=$dr|ConvertFrom-Json; if($d.backend -ne 'file' -or $d.embeddingDimensions -ne 1024 -or -not $d.local){throw 'unexpected doctor result'}
          $first=& $py -B bootstrap.py --hermes-home $h --settings $s --index | Out-String;"BOOTSTRAP1 $first"
          $r=$first|ConvertFrom-Json; if($r.status -eq 'failed' -or $r.index.documentsWritten -lt 1 -or -not $r.changed -or -not $r.kbSchemaCreated){throw 'first bootstrap failed'}
          $dr2=& $py -B student_tools.py --config $s doctor | Out-String;"DOCTOR2 $dr2"
          if($LASTEXITCODE -or ($dr2|ConvertFrom-Json).schema -ne 'ok' -or -not ($dr2|ConvertFrom-Json).wal){throw 'schema or WAL missing after bootstrap'}
          $sr=& $py -B student_tools.py --config $s search "маяк кораблям" --profile tech --project __skills__ | Out-String
          "SEARCH $($sr.Substring(0,[Math]::Min(400,$sr.Length)))"
          $hits=@(($sr|ConvertFrom-Json).results)
          if($hits.Count -lt 1 -or (Split-Path -Leaf $hits[0].source) -ne 'note.md' -or $hits[0].content -notmatch 'кораблям'){throw 'Russian search did not find note.md first'}
          $second=& $py -B bootstrap.py --hermes-home $h --settings $s --index | Out-String;"BOOTSTRAP2 $second"
          $r2=$second|ConvertFrom-Json; if($r2.changed -ne $false -or $r2.changedFiles -ne 0 -or $r2.index.documentsWritten -ne 0){throw 'repeat bootstrap changed something'}
          foreach($p in 'tech','copywriter'){
            foreach($f in 'AGENTS.md','SOUL.md'){$x=Get-Content -Raw -Encoding UTF8 (Join-Path $h "profiles\$p\$f");$n=([regex]::Matches($x,'agents-student-tooling:start')).Count;if($n -ne 1){throw "block $p/$f=$n"};if($f -eq 'AGENTS.md' -and $x -notmatch 'Личное правило ученика'){throw 'personal text lost'}}
            $y=Get-Content -Raw -Encoding UTF8 (Join-Path $h "profiles\$p\config.yaml")
            if($y -notmatch "Технарь $p" -or $y -notmatch 'student-agent-kb'){throw "config.yaml of $p lost Cyrillic text or the MCP entry"}
          }
          # The index lock (msvcrt on Windows): a second index while one holds it does nothing.
          $code=@(
            'import importlib.util,json,subprocess,sys'
            'spec=importlib.util.spec_from_file_location(''t'',''student_tools.py'');t=importlib.util.module_from_spec(spec);spec.loader.exec_module(t)'
            'lock=t.IndexLock(t.guard(t.config(sys.argv[1])[''kbFile'']));assert lock.acquire()'
            'r=subprocess.run([sys.executable,''-B'',''student_tools.py'',''--config'',sys.argv[1],''index''],capture_output=True,text=True);lock.release()'
            'print(r.stdout.strip());sys.exit(0 if json.loads(r.stdout)=={''status'':''index-already-running''} else 1)'
          ) -join "`n"
          Set-Content -LiteralPath "$env:RUNNER_TEMP\lock-check.py" -Encoding ascii -Value $code
          & $py -B "$env:RUNNER_TEMP\lock-check.py" $s; if($LASTEXITCODE){throw 'a second index ran while the first held the lock'}
          'TOOLING_IDEMPOTENT changed=false, blocks intact, Cyrillic config intact, lock holds'
      - name: Real stdio MCP call of agent_kb_search (direct, and through the vault-mcp launcher)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          [Console]::OutputEncoding=[Text.Encoding]::UTF8;$OutputEncoding=[Text.Encoding]::UTF8
          $py="$env:RUNNER_TEMP\tv\Scripts\python.exe";$s="$env:RUNNER_TEMP\tooling\settings.json"
          $direct=& $py -B release\mcp-smoke.py --settings $s --query 'маяк кораблям' --expect note.md | Out-String;"MCP_DIRECT $direct"
          if($LASTEXITCODE){throw 'MCP stdio search failed'}
          # vault-mcp has no exec on Windows: launch_mcp runs the server as a child on this stdio.
          $child=& $py -B release\mcp-smoke.py --settings $s --query 'маяк кораблям' --expect note.md --via-launcher | Out-String;"MCP_VIA_LAUNCHER $child"
          if($LASTEXITCODE){throw 'MCP stdio search through launch_mcp failed'}
      - name: Index refresh as a per-user scheduled task (no administrator rights, no resident process)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py="$env:RUNNER_TEMP\tv\Scripts\python.exe";$t="$env:RUNNER_TEMP\tooling";$s="$t\settings.json";$task='AgentsTooling-KB-Index'
          try{
            $one=& $py -B student_tools.py --config $s schedule-index --interval-minutes 5 | Out-String;"SCHEDULE1 $one"
            if($LASTEXITCODE -or ($one|ConvertFrom-Json).changed -ne $true){throw 'schedule-index failed'}
            $two=& $py -B student_tools.py --config $s schedule-index --interval-minutes 5 | Out-String;"SCHEDULE2 $two"
            if($LASTEXITCODE -or ($two|ConvertFrom-Json).changed -ne $false){throw 'schedule-index is not idempotent'}
            # schtasks may write the XML as UTF-16; drop the NULs so ASCII patterns match either way.
            $xml=(& schtasks.exe /Query /TN $task /XML | Out-String) -replace "`0",''
            if($xml -notmatch 'PT5M' -or $xml -notmatch 'pythonw\.exe' -or $xml -notmatch 'LeastPrivilege' -or $xml -notmatch 'IgnoreNew'){throw 'unexpected task definition'}
            $status="$t\index-status.json"; if(Test-Path -LiteralPath $status){Remove-Item -LiteralPath $status}
            & schtasks.exe /Run /TN $task | Out-Null
            $deadline=(Get-Date).AddSeconds(240);while(-not (Test-Path -LiteralPath $status) -and (Get-Date) -lt $deadline){Start-Sleep 3}
            if(Test-Path -LiteralPath $status){
              $body=Get-Content -Raw -Encoding UTF8 $status;"SCHEDULED_RUN $body"
              if(($body|ConvertFrom-Json).status -ne 'ok'){throw 'the scheduled index run failed'}
            }else{
              # The runner session may not allow interactive-logon tasks to start: reported, not hidden.
              'SCHEDULED_RUN_NOT_OBSERVED (task registered; the runner did not start it within 240 s)'
              & schtasks.exe /Query /TN $task /V /FO LIST | Select-String -Pattern 'Status|Last Result|Logon Mode'
            }
          }finally{
            $gone=& $py -B student_tools.py --config $s unschedule-index | Out-String;"UNSCHEDULE $gone"
          }
          & schtasks.exe /Query /TN $task 2>$null | Out-Null; if($LASTEXITCODE -eq 0){throw 'the task is still registered'}
          $global:LASTEXITCODE=0
      # Cyrillic text: PowerShell 7 reads the step as UTF-8; Windows PowerShell 5.1 would
      # read the BOM-less script in cp1252 and break its strings.
      - name: Pinned Whisper model and offline transcription of a short Russian phrase
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          [Console]::OutputEncoding=[Text.Encoding]::UTF8;$OutputEncoding=[Text.Encoding]::UTF8
          $py="$env:RUNNER_TEMP\tv\Scripts\python.exe";$m="$env:RUNNER_TEMP\models\small"
          & $py -B student_tools.py fetch-whisper-model --model-dir $m; if($LASTEXITCODE){exit 1}
          $again=& $py -B student_tools.py fetch-whisper-model --model-dir $m | Out-String; if(($again|ConvertFrom-Json).changed -ne $false){throw 'model fetch not idempotent'}
          # Offline for real. A Windows venv python.exe is a redirector: the base interpreter
          # it starts opens the sockets, so block both, and give the process a dead proxy too.
          $exes=@(& $py -c "import sys;print(sys.executable);print(sys._base_executable)")|ForEach-Object{$_.Trim()}|Where-Object{$_}|Sort-Object -Unique
          $i=0;foreach($e in $exes){$i++;New-NetFirewallRule -DisplayName "tooling-offline-asr-$i" -Direction Outbound -Action Block -Program $e | Out-Null}
          $saved=@{};foreach($k in 'HTTPS_PROXY','HTTP_PROXY','ALL_PROXY','NO_PROXY'){$saved[$k]=[Environment]::GetEnvironmentVariable($k)}
          $env:HTTPS_PROXY='http://127.0.0.1:9';$env:HTTP_PROXY='http://127.0.0.1:9';$env:ALL_PROXY='http://127.0.0.1:9';$env:NO_PROXY=''
          try{
            & $py -c "import urllib.request,sys;urllib.request.urlopen('https://huggingface.co',timeout=10);sys.exit(0)" 2>$null
            if($LASTEXITCODE -eq 0){throw 'OFFLINE_NOT_ENFORCED: the interpreter still reaches the network'}
            'OFFLINE_ENFORCED'
            $out=& $py -B student_tools.py transcribe --model-dir $m --audio tests\fixtures\ru-phrase.wav --output "$env:RUNNER_TEMP\asr.json" | Out-String
            if($LASTEXITCODE){throw "offline transcription failed: $out"}
            # The knowledge base is offline too: search embeds the query in-process.
            $kb=& $py -B student_tools.py --config "$env:RUNNER_TEMP\tooling\settings.json" search "маяк кораблям" | Out-String
            if($LASTEXITCODE -or @(($kb|ConvertFrom-Json).results).Count -lt 1){throw 'offline knowledge-base search failed'}
            'KB_SEARCH_OFFLINE_OK'
          }finally{
            1..$i|ForEach-Object{Remove-NetFirewallRule -DisplayName "tooling-offline-asr-$_" -ErrorAction SilentlyContinue}
            foreach($k in $saved.Keys){[Environment]::SetEnvironmentVariable($k,$saved[$k])}
          }
          $asr=Get-Content -Raw -Encoding UTF8 "$env:RUNNER_TEMP\asr.json"|ConvertFrom-Json
          $text=($asr.segments|%{$_.text}) -join ' ';"ASR language=$($asr.language) text=$text"
          if($asr.language -ne 'ru' -or $text -notmatch '(?i)распознав' -or $text -notmatch '(?i)интернет'){throw 'unexpected transcript'}
      # Informational: the Windows browser path of Hermes 0.23 is not a pass criterion of
      # this run. Its result decides what FOR-CODEX says about the browser on Windows.
      - name: Hermes Chromium headless smoke (informational)
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $hermes=Join-Path $env:LOCALAPPDATA 'hermes\bin\hermes.exe'
          if(-not (Test-Path -LiteralPath $hermes)){$hermes=(Get-Command hermes -ErrorAction Stop).Source}
          $hpy=Join-Path $env:LOCALAPPDATA 'hermes\hermes-agent\venv\Scripts\python.exe'
          if(-not (Test-Path -LiteralPath $hpy)){throw "Hermes python not found at $hpy"}
          & $hermes pm install chromium; if($LASTEXITCODE){throw 'hermes pm install chromium failed'}
          $out=& $hpy -B browser-smoke.py --hermes-python $hpy --hermes-home (Join-Path $env:LOCALAPPDATA 'hermes\profiles\tech') | Out-String;"BROWSER_SMOKE $out"
          if($LASTEXITCODE){throw 'browser smoke failed'}
      - name: Bitwarden Secrets Manager CLI (pinned official release, SHA-256)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          $zip="$env:RUNNER_TEMP\bws.zip";$dir="$env:RUNNER_TEMP\bws"
          $url="https://github.com/bitwarden/sdk-sm/releases/download/bws-v$env:BWS_VERSION/bws-x86_64-pc-windows-msvc-$env:BWS_VERSION.zip"
          for($i=1;$i -le 4;$i++){try{Invoke-WebRequest -UseBasicParsing $url -OutFile $zip -TimeoutSec 120;break}catch{if($i -eq 4){throw};Start-Sleep -Seconds (10*$i)}}
          if((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:BWS_ZIP_SHA256){throw 'bws archive SHA256 mismatch'}
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force;Remove-Item -LiteralPath $zip
          $exe=@(Get-ChildItem -LiteralPath $dir -Recurse -Filter bws.exe)
          if($exe.Count -ne 1){throw 'bws.exe not found in the archive'}
          $version=(& $exe[0].FullName --version 2>&1|Out-String).Trim();"BWS $version"
          if($version -notmatch [regex]::Escape($env:BWS_VERSION)){throw 'unexpected bws version'}
      - name: No secret copied into the tooling folder, the index or the instructions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $roots=@("$env:RUNNER_TEMP\tooling",(Join-Path $env:LOCALAPPDATA 'hermes\profiles'))
          $bad=@()
          foreach($r in $roots){
            Get-ChildItem -LiteralPath $r -Recurse -File | Where-Object { $_.Name -ne 'auth.json' } | ForEach-Object {
              $raw=[Text.Encoding]::Latin1.GetString([IO.File]::ReadAllBytes($_.FullName))
              if($raw.Contains('CANARY-WINDOWS-SECRET')){$bad+=$_.FullName}
            }
          }
          if($bad){throw "secret copied into: $($bad -join ', ')"}
          'NO_SECRET_COPIED (tooling, SQLite index with WAL, profiles)'
